alias: Alert when grid is down
description: ''
triggers:
  - trigger: state
    entity_id:
      - sensor.franklinwh_grid_status
    to:
      - DOWN
      - 'OFF'
    for:
      hours: 0
      minutes: 5
      seconds: 0
conditions: []
actions:
  - action: script.play_alpha_centauri_sound_on_livingroom
    metadata: {}
    data:
      soundfile: media-source://media_source/local/cpu resource shortfall.wav
mode: single
