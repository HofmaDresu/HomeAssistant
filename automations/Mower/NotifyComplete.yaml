alias: 'Mower: Notify complete'
description: ''
triggers:
  - trigger: lawn_mower.returned_to_dock
    target:
      device_id: 0210f440c83128d3e08a0c33fb62266e
    options:
      behavior: each
conditions:
  - condition: not
    conditions:
      - condition: and
        conditions:
          - condition: state
            entity_id: sensor.mo99_last_error_code
            state:
              - '11133'
          - condition: template
            value_template: >-
              {{(as_timestamp(now()) -
              as_timestamp(states.sensor.mo99_last_error_time.state)) /60 / 60 <
              1}}
            alias: Error within last hour
    alias: Wasn't canceled
actions:
  - data:
      title: Mo
      message: Mowing has finished
      data:
        channel: Mo automation
        priority: high
        ttl: 0
        notification_icon: mdi:robot-mower
    action: notify.mobile_app_pixel_8
  - action: input_datetime.set_datetime
    metadata: {}
    target:
      entity_id: input_datetime.mower_last_mowed_date
    data:
      date: '{{ now().strftime(''%Y-%m-%d'') }}'
  - action: script.play_alpha_centauri_sound_on_livingroom
    metadata: {}
    data:
      soundfile: media-source://media_source/local/CPU terraform complete.wav
mode: single
